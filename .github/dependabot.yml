version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    # 项目支持JDK 8,JUnit 6需要Java 17,忽略其大版本升级
    ignore:
      - dependency-name: "org.junit.jupiter:*"
        versions: [">=6"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

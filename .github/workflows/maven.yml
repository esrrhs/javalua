name: Java CI

on: [push]

jobs:
  build:
    # 只跑 JDK 21：协程依赖虚拟线程(JEP 444),这是本实现的下限。
    # 旧的多版本矩阵(8/11/17)在引入 release=21 之后已经无意义。
    runs-on: ubuntu-latest
    name: Build (JDK 21)
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    - name: Build with Maven Wrapper
      run: ./mvnw -B test package

  conformance:
    # 一致性测试:拿真实的 lua5.4 当裁判。
    #
    # 这是本项目的主闸门——「看起来像 Lua」没有价值,唯一能证明「真的是 Lua」
    # 的办法是同一份脚本在两边跑出逐字节相同的 stdout。所以这个 job 先从源码
    # 构建一份参考实现,再把它的路径交给测试。
    #
    # 从源码构建而不是 apt install,是因为发行版里的 lua 版本不受控(可能是
    # 5.1/5.3/5.5),拿错版本当参考会得出错误的「不一致」结论,那比没有参考更糟。
    runs-on: ubuntu-latest
    name: Conformance (against lua5.4)
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    - name: Build reference lua5.4
      run: |
        set -e
        curl -sL -o /tmp/lua.tar.gz https://www.lua.org/ftp/lua-5.4.7.tar.gz
        mkdir -p target
        tar xzf /tmp/lua.tar.gz -C target
        mv target/lua-5.4.7 target/lua54
        make -C target/lua54 -j2 linux
        ./target/lua54/src/lua -v
    #
    # 字节码差分的另一半:一个挂在参考实现上的小转储器。
    # 不用 luac -l 是因为它每个 opcode 打的字段不一样、还夹注释,反解回原始
    # 字段要抄那个大 switch;这里自己对所有 opcode 统一打印全部字段。
    # 它必须和参考二进制同目录,测试才知道去哪儿找。
    - name: Build fkdump (bytecode dumper)
      run: |
        set -e
        #
        # 必须写成一行。YAML 的块标量(|)不处理反斜杠续行:写 "\\" 换行的话
        # bash 收到的是两个字符,被当成一个名为 "\" 的输入文件,ld 报
        # "cannot find \:" —— 这一步挂了,后面整个 conformance job 就静默地
        # 再也没跑过(连续 8 次 push 全是这个错,一致性闸门形同虚设)。
        gcc -O2 -I target/lua54/src -o target/lua54/src/fkdump src/test/resources/fkdump.c target/lua54/src/liblua.a -lm
        test -x target/lua54/src/fkdump
    #
    # 编译期差分的语料:上游自带的测试套件。这批脚本是 Lua 作者自己写的、
    # 专门用来压边界的,比手写几十条用例强得多。落到 target/lua54-tests,
    # 由 UpstreamSuiteTest(逐字节比对)与 UpstreamSmokeTest(只断言跑完)消费。
    - name: Fetch upstream lua test suite
      run: |
        set -e
        curl -sL -o /tmp/tests.tar.gz https://www.lua.org/tests/lua-5.4.7-tests.tar.gz
        mkdir -p target/lua54-tests
        tar xzf /tmp/tests.tar.gz -C target/lua54-tests --strip-components=1
        ls target/lua54-tests/*.lua | wc -l
    #
    # 跑全量而不是只挑几个类,并且不跳过覆盖率门禁。
    #
    # 只挑 ConformanceTest/CodegenTest/ParserTest 等于把上游套件、差分 fuzz、
    # 二进制 chunk 兼容这两批闸门留在 CI 之外——它们在 CI 上一次都没跑过,
    # 绿的只是本地。而覆盖率门禁跟一致性测试绑在一起(没有参考二进制时
    # 一致性测试整类跳过,门禁跟着跳过),所以 -Djacoco.skip=true 一加,
    # 覆盖率这条线在 CI 上也是空的:两条最硬的闸门都形同虚设。
    #
    # luashim:C API 那层薄壳。编出来之后 .so 扩展才能在 Java 版里加载
    # (package.loadlib 真的 dlopen)。这一步<b>故意不设 continue-on-error</b>:
    # 编不出来时 NativeExtTest / NativeApiTest 会整类跳过,而「跳过」在报告里
    # 和「跑过」长得一样——让 job 红掉才能发现 C 扩展这批闸门其实没在 CI 上跑。
    #
    # 逗号小数点的 locale。Lua 的数字进出都过 {@code localeconv()->decimal_point}
    # （{@code lua_getlocaledecpoint()}），而发行版自带的 runner 只装了 C 与 en_US
    # ——那两个的小数点都是 '.'，{@code os.setlocale("pt_BR")} 一律返回 nil，于是
    # LocaleNumberTest 与上游 literals.lua 那一段<b>静默地什么都没测</b>。
    # 这里生成它，并当场 grep 一遍确认真的在：装不上就让这一步红掉，
    # 别把「闸门没跑」留给下一份报告去猜。
    - name: Install a comma-decimal locale (pt_BR)
      run: |
        set -e
        command -v locale-gen >/dev/null 2>&1 || sudo apt-get install -y locales
        sudo locale-gen pt_BR.UTF-8
        locale -a | grep -i 'pt_BR'
    - name: Build luashim (C API shim)
      run: |
        set -e
        sh native/build.sh
        find src/main/resources/native -type f
    - name: Run conformance tests
      env:
        LUA54_BIN: target/lua54/src/lua
        FKDUMP_BIN: target/lua54/src/fkdump
        LUA54_TESTS: target/lua54-tests
      # 覆盖率校验留到两遍合并之后再算(见下面 coverage 那步):
      # 单拿 native 这一遍去卡合并门槛,等价于逼人删掉兜底代码。
      run: ./mvnw -B test -Djacoco.check.skip=true
    # maven 只会因为「有用例失败」而红。用例<b>消失</b>它是看不见的:
    # assumeTrue 的跳过在报告里和跑过长得一样,而 @TestFactory 里没建成用例
    # 更是什么痕迹都不留。这一步数一遍执行数,并点名几类必须出活的闸门。
    #
    # 下限取「本地实测值留 30 条余量」:这一遍实测 1109 条(带 shim 的
    # tools/local_conformance.sh 量出来的)。余量是给平台差异留的——真 C 扩展
    # 那批用例会因编译器/网络而异;而<b>一整类</b>没了是几十条的量级,
    # 卡得住。别把下限调到等于实测值:那会让每次加用例都要改 CI,
    # 也让人倾向于删用例。
    - name: Check the gates actually ran
      run: python3 tools/check_ci_gates.py 1080
    #
    # io 的第二条路径:native 层装不上时走 RandomAccessFile(见 IoLib#openJavaFile)。
    #
    # 这条路径在别处一次都没跑过:Build job 虽然没编 luashim,但它也没有参考
    # 二进制,差分用例整类跳过;Conformance job 有参考二进制但 luashim 装得上,
    # 于是走的永远是 C 那条。发行版 jar 里没带 luashim 的用户拿到的恰恰是这一条。
    # -Djavalua.nonative 强制当作装不上,再拿同一个 lua5.4 比一遍逐字节 stdout。
    # jacoco 的 agent 照常挂着(append),这样两遍的执行数据能合并。
    - name: Run conformance tests (pure-Java io path)
      env:
        LUA54_BIN: target/lua54/src/lua
        FKDUMP_BIN: target/lua54/src/fkdump
        LUA54_TESTS: target/lua54-tests
      run: ./mvnw -B test -Djavalua.nonative=true -Djacoco.check.skip=true
    # 这一遍没有 C API 那批用例,下限另算(-Djavalua.nonative 下
    # NativeApiTest / NativeExtTest 是零用例返回,不是跳过;locale 小数点那批
    # 同理,那条路上小数点恒为 '.')。实测 927 条,同样留 30 条余量。
    # 927 比 native 那遍少 182 条,其中一条是 UpstreamSuiteTest 的
    # literals.lua:它要 os.setlocale 真的能改 libc 的 locale 才能逐字节比,
    # 没有 shim 时只有参考实现设得上,输出天然多一行,所以那条用例在
    # 这一遍<b>根本不存在</b>(UpstreamSuiteTest#suiteFiles)。
    - name: Check the gates actually ran (pure-Java io path)
      run: python3 tools/check_ci_gates.py 900 --nonative
    #
    # 覆盖率:两条 io 路径<b>合并</b>后的行覆盖率才是门禁对象。
    # 上面两遍各写了一份 jacoco.exec(append),这里不再跑测试,
    # 只用合并后的数据出报告并卡一次门槛。
    #
    # env 那三行不是多余的:pom 里的 no-reference-lua profile 是按
    # <b>环境变量在不在</b>来决定跳不跳校验的。这一步不跑测试,但它同样
    # 会命中那个 profile——没有 LUA54_BIN 就静默跳过,整个覆盖率闸门
    # 又变回「绿着没跑」。
    - name: Check coverage of both io paths together
      env:
        LUA54_BIN: target/lua54/src/lua
        FKDUMP_BIN: target/lua54/src/fkdump
        LUA54_TESTS: target/lua54-tests
      run: ./mvnw -B -DskipTests test -Djacoco.line.minimum=0.95

  quality:
    # spotbugs 静态分析:只把 HIGH 优先级当闸门(见 pom.xml 里 quality profile
    # 的注释),其余照常出报告。以前 failOnError=false 加上「只上传产物」=
    # 这个 job 永远不会红,新增问题一个也拦不住。
    runs-on: ubuntu-latest
    name: Static analysis
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    - name: SpotBugs
      run: ./mvnw -B verify -Pquality -DskipTests
    - name: Upload SpotBugs report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: spotbugs-report
        path: target/spotbugsXml.xml
        if-no-files-found: ignore

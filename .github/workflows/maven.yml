name: Java CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['8', '11', '17', '21']
    name: Build (JDK ${{ matrix.java }})
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'maven'
    - name: Build with Maven Wrapper
      run: ./mvnw -B test package

  grammar:
    # 验证YYParser.java可以从语法文件重新生成(ubuntu自带bison 3.x)
    runs-on: ubuntu-latest
    name: Grammar regeneration
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    - name: Regenerate parser and test
      run: ./mvnw -B clean test -Pgrammar

  fuzz:
    # 覆盖率引导的模糊测试(Jazzer/libFuzzer)。
    #
    # 语料库不入库,所以默认 mvn test 的回归模式只能回放极少量输入;真正的
    # 探索依赖这个 job 的限时 fuzzing。退出码 124 表示 libFuzzer 跑满时限
    # 仍未发现缺陷,视为通过;任何其他非零码说明找到了反例,让 job 变红。
    runs-on: ubuntu-latest
    name: Fuzzing (Jazzer)
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    - name: Fuzz expression invariants
      env:
        JAZZER_FUZZ: '1'
      run: |
        # fuzzing 模式下每次运行只执行一个 fuzz test,故显式指定目标
        #
        # 注意:本步骤默认 bash -e,而 timeout 超时会返回 124(非零),会直接终止
        # 脚本让后面的判断根本执行不到。必须用 || 接住退出码。
        code=0
        timeout 120 ./mvnw -B test -Dtest='JazzerFuzzTest#fuzzExpressionRenderingInvariants' -Djacoco.skip=true || code=$?
        if [ "$code" -eq 124 ]; then
          echo "reached time limit without findings"
          exit 0
        fi
        echo "fuzzing exited with $code"
        exit "$code"
    - name: Fuzz stdlib differential invariants
      env:
        JAZZER_FUZZ: '1'
      run: |
        # 同一套 timeout 退出码处理。标准库差分 oracle 与表达式不变式是两类
        # 不同的缺陷面,各给一段探索预算
        code=0
        timeout 120 ./mvnw -B test -Dtest='JazzerFuzzTest#fuzzArrayOpsAgainstModel' -Djacoco.skip=true || code=$?
        if [ "$code" -eq 124 ]; then
          echo "reached time limit without findings"
          exit 0
        fi
        echo "fuzzing exited with $code"
        exit "$code"
    - name: Upload findings
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: jazzer-findings
        path: crash-*
        if-no-files-found: ignore

  quality:
    # spotbugs静态分析报告(报告模式,不阻断)
    runs-on: ubuntu-latest
    name: Static analysis
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    - name: SpotBugs
      run: ./mvnw -B verify -Pquality -DskipTests
    - name: Upload SpotBugs report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: spotbugs-report
        path: target/spotbugsXml.xml
        if-no-files-found: ignore

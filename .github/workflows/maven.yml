name: Java CI

on:
  push:
  pull_request:

jobs:
  build:
    # 只跑 JDK 21：协程依赖虚拟线程(JEP 444),这是本实现的下限。
    # 旧的多版本矩阵(8/11/17)在引入 release=21 之后已经无意义。
    runs-on: ubuntu-latest
    name: Build (JDK 21)
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    # All tests belong to the oracle-backed matrix below, not an oracle-less
    # packaging job where differential assumptions would silently abort.
    - name: Package with Maven Wrapper
      run: ./mvnw -B -DskipTests package

  conformance:
    runs-on: ubuntu-latest
    name: Conformance (${{ matrix.mode }}, Lua 5.3.4)
    strategy:
      fail-fast: false
      matrix:
        mode: [native, java]
    timeout-minutes: 50
    env:
      LUA53_BIN: target/lua53/src/lua
      LUAC53_BIN: target/lua53/src/luac
      FKDUMP_BIN: target/lua53/src/fkdump
      TBLSTRUCT_BIN: target/lua53/src/tblstruct
      LUA53_TESTS: target/lua53-tests
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    - name: Build checksum-pinned PUC-Rio 5.3.4 and test corpus
      run: sh tools/prepare_reference.sh
    - name: Install comma-decimal locale
      run: |
        set -eu
        command -v locale-gen >/dev/null 2>&1 || sudo apt-get install -y locales
        sudo locale-gen pt_BR.UTF-8
        locale -a | grep -i 'pt_BR'
    # Build in BOTH lanes. ExecutionModeTest proves Java mode does not map the shim,
    # even when it is bundled, and proves native mode cannot silently fall back.
    - name: Build luashim
      run: sh native/build.sh
    - name: Test gate checker
      run: python3 -m unittest discover -s tools -p 'test_ci_gates.py'
    - name: Run full applicable suite
      timeout-minutes: 40
      run: |
        set -eu
        extra=""
        if [ "${{ matrix.mode }}" = java ]; then extra="-Djavalua.nonative=true"; fi
        python3 tools/run_bounded.py --seconds 1800 -- ./mvnw -B test -Djavalua.requireReference=true -Djavalua.test.mode=${{ matrix.mode }} -Djacoco.check.skip=true $extra
    - name: Verify executed tests and narrow skip allowlist
      if: always()
      run: |
        if [ "${{ matrix.mode }}" = java ]; then
          python3 tools/check_ci_gates.py 1185 --nonative
        else
          python3 tools/check_ci_gates.py 1345
        fi
    - name: Upload lane diagnostics and coverage data
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: conformance-${{ matrix.mode }}
        path: |
          target/surefire-reports/
          target/generated-diff/
          target/fuzz/
          target/rt/
          target/jacoco.exec
        if-no-files-found: error
        retention-days: 14

  coverage:
    needs: conformance
    runs-on: ubuntu-latest
    name: Combined native + Java coverage (90%)
    env:
      # The report-only job must not activate no-reference-lua's skip profile.
      LUA53_BIN: target/lua53/src/lua
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    - uses: actions/download-artifact@v8
      with:
        pattern: conformance-*
        path: target/coverage-input
    - name: Merge exactly two lane sessions and enforce unchanged coverage gate
      run: |
        python3 - <<'PY'
        from pathlib import Path
        files = list(Path('target/coverage-input').rglob('jacoco.exec'))
        assert len(files) == 2 and all(p.stat().st_size for p in files), files
        PY
        ./mvnw -B -Pcoverage-merge -DskipTests test -Djacoco.line.minimum=0.90
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: combined-coverage
        path: target/site/jacoco/
        if-no-files-found: error

  quality:
    # spotbugs 静态分析:只把 HIGH 优先级当闸门(见 pom.xml 里 quality profile
    # 的注释),其余照常出报告。以前 failOnError=false 加上「只上传产物」=
    # 这个 job 永远不会红,新增问题一个也拦不住。
    runs-on: ubuntu-latest
    name: Static analysis
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    - name: SpotBugs
      run: ./mvnw -B verify -Pquality -DskipTests
    - name: Upload SpotBugs report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: spotbugs-report
        path: target/spotbugsXml.xml
        if-no-files-found: ignore

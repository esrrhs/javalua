name: Java CI

on: [push]

jobs:
  build:
    # 只跑 JDK 21：协程依赖虚拟线程(JEP 444),这是本实现的下限。
    # 旧的多版本矩阵(8/11/17)在引入 release=21 之后已经无意义。
    runs-on: ubuntu-latest
    name: Build (JDK 21)
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    - name: Build with Maven Wrapper
      run: ./mvnw -B test package

  conformance:
    # 一致性测试:拿真实的 lua5.4 当裁判。
    #
    # 这是本项目的主闸门——「看起来像 Lua」没有价值,唯一能证明「真的是 Lua」
    # 的办法是同一份脚本在两边跑出逐字节相同的 stdout。所以这个 job 先从源码
    # 构建一份参考实现,再把它的路径交给测试。
    #
    # 从源码构建而不是 apt install,是因为发行版里的 lua 版本不受控(可能是
    # 5.1/5.3/5.5),拿错版本当参考会得出错误的「不一致」结论,那比没有参考更糟。
    runs-on: ubuntu-latest
    name: Conformance (against lua5.4)
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    - name: Build reference lua5.4
      run: |
        set -e
        curl -sL -o /tmp/lua.tar.gz https://www.lua.org/ftp/lua-5.4.7.tar.gz
        mkdir -p target
        tar xzf /tmp/lua.tar.gz -C target
        mv target/lua-5.4.7 target/lua54
        make -C target/lua54 -j2 linux
        ./target/lua54/src/lua -v
    #
    # 字节码差分的另一半:一个挂在参考实现上的小转储器。
    # 不用 luac -l 是因为它每个 opcode 打的字段不一样、还夹注释,反解回原始
    # 字段要抄那个大 switch;这里自己对所有 opcode 统一打印全部字段。
    # 它必须和参考二进制同目录,测试才知道去哪儿找。
    - name: Build fkdump (bytecode dumper)
      run: |
        set -e
        #
        # 必须写成一行。YAML 的块标量(|)不处理反斜杠续行:写 "\\" 换行的话
        # bash 收到的是两个字符,被当成一个名为 "\" 的输入文件,ld 报
        # "cannot find \:" —— 这一步挂了,后面整个 conformance job 就静默地
        # 再也没跑过(连续 8 次 push 全是这个错,一致性闸门形同虚设)。
        gcc -O2 -I target/lua54/src -o target/lua54/src/fkdump src/test/resources/fkdump.c target/lua54/src/liblua.a -lm
        test -x target/lua54/src/fkdump
    #
    # 编译期差分的语料:上游自带的测试套件。这批脚本是 Lua 作者自己写的、
    # 专门用来压边界的,比手写几十条用例强得多。目前只编译不运行。
    - name: Fetch upstream lua test suite
      run: |
        set -e
        curl -sL -o /tmp/tests.tar.gz https://www.lua.org/tests/lua-5.4.7-tests.tar.gz
        mkdir -p target/lua54-tests
        tar xzf /tmp/tests.tar.gz -C target/lua54-tests --strip-components=1
        ls target/lua54-tests/*.lua | wc -l
    #
    # 跑全量而不是只挑几个类,并且不跳过覆盖率门禁。
    #
    # 只挑 ConformanceTest/CodegenTest/ParserTest 等于把上游套件、差分 fuzz、
    # 二进制 chunk 兼容这两批闸门留在 CI 之外——它们在 CI 上一次都没跑过,
    # 绿的只是本地。而覆盖率门禁跟一致性测试绑在一起(没有参考二进制时
    # 一致性测试整类跳过,门禁跟着跳过),所以 -Djacoco.skip=true 一加,
    # 覆盖率这条线在 CI 上也是空的:两条最硬的闸门都形同虚设。
    #
    # luashim:C API 那层薄壳。编出来之后 .so 扩展才能在 Java 版里加载
    # (package.loadlib 真的 dlopen)。这一步<b>故意不设 continue-on-error</b>:
    # 编不出来时 NativeExtTest / NativeApiTest 会整类跳过,而「跳过」在报告里
    # 和「跑过」长得一样——让 job 红掉才能发现 C 扩展这批闸门其实没在 CI 上跑。
    - name: Build luashim (C API shim)
      run: |
        set -e
        sh native/build.sh
        find src/main/resources/native -type f
    - name: Run conformance tests
      env:
        LUA54_BIN: target/lua54/src/lua
        FKDUMP_BIN: target/lua54/src/fkdump
      run: ./mvnw -B test

  quality:
    # spotbugs静态分析报告(报告模式,不阻断)
    runs-on: ubuntu-latest
    name: Static analysis
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    - name: SpotBugs
      run: ./mvnw -B verify -Pquality -DskipTests
    - name: Upload SpotBugs report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: spotbugs-report
        path: target/spotbugsXml.xml
        if-no-files-found: ignore
